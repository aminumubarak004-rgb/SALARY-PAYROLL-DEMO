<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tax Cup | Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="brand.css">
    <link rel="stylesheet" href="header-brand.css">
    <link rel="stylesheet" href="payroll.css">
    <style>
      :root {
        --tax-cream: #f8f4eb;
        --tax-ivory: #fffdf9;
        --tax-charcoal: #171715;
        --tax-muted: #5d5b56;
        --tax-gold: #c39a3c;
        --tax-gold-deep: #9d7420;
        --tax-line: rgba(29, 27, 24, 0.12);
        --tax-shadow: rgba(19, 17, 14, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        font-family: "Space Grotesk", sans-serif;
        background: var(--tax-cream);
        color: var(--tax-charcoal);
      }

      body {
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(120deg, rgba(248, 244, 235, 0.78), rgba(248, 244, 235, 0.82)),
          url("The%20Tax%20Cup%20Modern%20Finance%20Workspace.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
        z-index: 0;
        pointer-events: none;
      }

      body > * {
        position: relative;
        z-index: 1;
      }

      .login-shell {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 20px 40px;
      }

      .login-topbar {
        width: min(1120px, 100%);
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 253, 249, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 10px 16px 10px 12px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 10px 24px rgba(25, 22, 18, 0.08);
      }

      .brand-logo {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand-name {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 18px;
        line-height: 1.1;
        color: var(--tax-charcoal);
      }

      .brand-name em {
        font-style: normal;
        color: var(--tax-gold);
      }

      .brand-tagline {
        font-family: "DM Mono", monospace;
        font-size: 8px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--tax-gold-deep);
      }

      .login-card {
        width: min(100%, 460px);
        background: rgba(255, 253, 249, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 28px;
        padding: 30px 28px 24px;
        box-shadow: 0 24px 55px var(--tax-shadow);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 16px;
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--tax-gold-deep);
      }

      .kicker::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--tax-gold), #f2d08d);
        display: inline-block;
        box-shadow: 0 0 0 5px rgba(195, 154, 60, 0.18);
      }

      .login-card h1 {
        margin: 0;
        font-size: clamp(2.1rem, 3vw, 3.2rem);
        line-height: 1.02;
        letter-spacing: -0.07em;
        font-weight: 700;
        color: var(--tax-charcoal);
      }

      .login-card h1 span {
        color: var(--tax-gold-deep);
      }

      .login-subtitle {
        margin: 14px 0 22px;
        color: var(--tax-muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      #login-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label,
      .label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 0.86rem;
        font-weight: 600;
        color: var(--tax-charcoal);
      }

      .field-control {
        position: relative;
        display: flex;
        align-items: center;
        background: rgba(248, 244, 235, 0.8);
        border: 1px solid var(--tax-line);
        border-radius: 14px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      .field-control:focus-within {
        border-color: rgba(195, 154, 60, 0.8);
        box-shadow: 0 0 0 4px rgba(195, 154, 60, 0.12);
      }

      .field-icon {
        width: 42px;
        height: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--tax-gold-deep);
        opacity: 0.9;
      }

      .field-control svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: var(--tax-charcoal);
        font: inherit;
        font-size: 0.98rem;
        padding: 14px 12px 14px 0;
      }

      input::placeholder {
        color: rgba(93, 91, 86, 0.65);
      }

      .password-toggle {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--tax-gold-deep);
        font: 600 0.78rem "DM Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 0 14px 0 0;
      }

      .primary-button {
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--tax-gold) 0%, var(--tax-gold-deep) 100%);
        color: #fffdf7;
        font: 700 0.96rem "Space Grotesk", sans-serif;
        letter-spacing: 0.02em;
        padding: 16px 18px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        box-shadow: 0 16px 28px rgba(157, 116, 32, 0.28);
      }

      .primary-button:hover,
      .primary-button:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 18px 28px rgba(157, 116, 32, 0.32);
        filter: brightness(1.02);
      }

      .login-error {
        min-height: 20px;
        margin: 0;
        color: #a33a2d;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      .login-help {
        margin: 18px 0 0;
        color: var(--tax-muted);
        font-size: 0.92rem;
        line-height: 1.6;
      }

      .login-help strong {
        color: var(--tax-charcoal);
        font-weight: 700;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        color: #fffaf2;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        background: rgba(20, 18, 15, 0.32);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        padding: 10px 14px;
        backdrop-filter: blur(6px);
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .back-link:hover,
      .back-link:focus-visible {
        background: rgba(20, 18, 15, 0.48);
        border-color: rgba(255, 255, 255, 0.35);
      }

      @media (max-width: 700px) {
        .login-shell {
          padding: 18px 14px 28px;
        }

        .login-topbar {
          margin-bottom: 12px;
        }

        .brand {
          padding: 8px 12px;
        }

        .brand-name {
          font-size: 16px;
        }

        .brand-tagline {
          font-size: 7px;
          letter-spacing: 0.08em;
        }

        .login-card {
          padding: 24px 18px 20px;
          border-radius: 22px;
        }
      }

      @media (max-width: 420px) {
        .brand {
          width: 100%;
          justify-content: center;
          padding: 10px 14px;
        }

        .brand .brand-copy {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <div class="login-topbar">
        <div class="brand">
          <img class="brand-logo" src="tax-cup-logo.svg" alt="The Tax Cup logo">
          <span class="brand-copy">
            <span class="brand-name">THE <em>TAX</em> CUP</span>
            <small class="brand-tagline">SIMPLIFYING TAX &amp; COMPLIANCE FOR BUSINESSES</small>
          </span>
        </div>
      </div>

      <section class="login-card" aria-label="Sign in form">
        <p class="kicker">Secure access</p>
        <h1>Welcome <span>Back</span></h1>
        <p class="login-subtitle">Sign in to access your tax and compliance dashboard.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email address</label>
            <div class="field-control">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"></path>
                  <path d="m5 7 7 6 7-6"></path>
                </svg>
              </span>
              <input id="login-email" type="email" placeholder="name@organization.com" autocomplete="email" required>
            </div>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="login-password">Password</label>
              <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">Show</button>
            </div>
            <div class="field-control">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                  <path d="M8 10V8a4 4 0 1 1 8 0v2"></path>
                </svg>
              </span>
              <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
          </div>

          <button class="primary-button" type="submit">Sign In</button>
          <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
        </form>

        <p class="login-help">Need access? Ask your Super Administrator to create your account in <strong>Users &amp; roles</strong>.</p>
        <p class="login-help"><a href="demo.html">Explore the public read-only demo ↗</a></p>
      </section>

      <a class="back-link" href="index.html">← Return to calculator</a>
    </main>

    <script src="login.js"></script>
  </body>
</html>
